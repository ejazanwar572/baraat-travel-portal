<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baraat Pass • Mobile Boarding Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 20px;
    }
    .app-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-live {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }
    .search-bar-wrap {
      position: sticky;
      top: 10px;
      z-index: 50;
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      padding: 14px 18px 14px 44px;
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .wallet-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
      position: relative;
    }
    .card-notch-left, .card-notch-right {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--bg);
      border-radius: 50%;
      top: 240px;
      z-index: 5;
    }
    .card-notch-left { left: -12px; }
    .card-notch-right { right: -12px; }
    .card-top {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 24px;
    }
    .card-top.groom-top {
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
    }
    .flight-route {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
    .stn-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }
    .stn-city {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-top: 4px;
    }
    .plane-icon {
      font-size: 1.4rem;
      opacity: 0.8;
    }
    .card-middle {
      padding: 20px 24px;
      background: #ffffff;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
    }
    .info-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 2px;
    }
    .leg-badge-box {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
      margin-bottom: 12px;
    }
    .leg-badge-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0284c7;
      margin-bottom: 4px;
    }
    .card-bottom {
      background: #f1f5f9;
      padding: 18px 24px;
      border-top: 2px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .barcode-sim {
      height: 42px;
      background: repeating-linear-gradient(90deg, #0f172a 0px, #0f172a 2px, transparent 2px, transparent 5px, #0f172a 5px, #0f172a 9px);
      border-radius: 4px;
    }
    .btn-wa-pass {
      background: #25D366;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
    }
  </style>
</head>

2": {"train": "12040 Shatabdi", "coach": "C3", "seat": "34", "berth": "Window Side", "pnr": "2361756513", "status": "CNF", "catering": "Non-Veg"}, "leg3": {"train": "13010 Doon Exp", "coach": "TBD", "seat": "TBD", "berth": "TBD", "pnr": "Pending", "status": "Pending"}}, {"id": "p28", "name": "Senior Guest 1 (M 60)", "short_name": "Guest (M 60)", "age": 60, "gender": "M", "relation": "Elder Relative", "leg1": {"train": "12397 Mahabodhi", "coach": "B1", "seat": "43", "berth": "UB (Upper)", "pnr": "660-8443705", "status": "CNF"}, "leg2": {"train": "12040 Shatabdi", "coach": "C3 (TBD)", "seat": "TBD", "berth": "Ticket 1 Pending", "pnr": "Ticket 1", "status": "CNF", "catering": "Non-Veg"}, "leg3": {"train": "13010 Doon Exp", "coach": "TBD", "seat": "TBD", "berth": "TBD", "pnr": "Pending", "status": "Pending"}}, {"id": "p29", "name": "Family Guest 2 (M 19)", "short_name": "Guest (M 19)", "age": 19, "gender": "M", "relation": "Youth / Relative", "leg1": {"train": "12397 Mahabodhi", "coach": "B1", "seat": "45", "berth": "MB (Middle)", "pnr": "660-8443705", "status": "CNF"}, "leg2": {"train": "12040 Shatabdi", "coach": "C3 (TBD)", "seat": "TBD", "berth": "Ticket 1 Pending", "pnr": "Ticket 1", "status": "CNF", "catering": "Non-Veg"}, "leg3": {"train": "13010 Doon Exp", "coach": "TBD", "seat": "TBD", "berth": "TBD", "pnr": "Pending", "status": "Pending"}}, {"id": "p30", "name": "Youth Guest 3 (M 16)", "short_name": "Guest (M 16)", "age": 16, "gender": "M", "relation": "Youth / Relative", "leg1": {"train": "12397 Mahabodhi", "coach": "B1", "seat": "40", "berth": "SU (Side Upper)", "pnr": "694-8548028", "status": "CNF"}, "leg2": {"train": "12040 Shatabdi", "coach": "C3 (TBD)", "seat": "TBD", "berth": "Ticket 1 Pending", "pnr": "Ticket 1", "status": "CNF", "catering": "Non-Veg"}, "leg3": {"train": "13010 Doon Exp", "coach": "TBD", "seat": "TBD", "berth": "TBD", "pnr": "Pending", "status": "Pending"}}];
    let currentChip = 'all';

    function renderWallet(list = passengers) {
      const container = document.getElementById('walletList');
      if (!list.length) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">No boarding pass found</div>';
        return;
      }
      container.innerHTML = list.map(p => {
        const isGroom = p.relation.toLowerCase().includes('groom');
        return `
          <div class="wallet-card">
            <div class="card-notch-left"></div>
            <div class="card-notch-right"></div>

            <div class="card-top ${isGroom ? 'groom-top' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; opacity:0.9;">
                <span>WEDDING TRAVEL PASS</span>
                <span>${p.relation.toUpperCase()}</span>
              </div>
              <div class="flight-route">
                <div>
                  <div class="stn-code">GAYA</div>
                  <div class="stn-city">Gaya Jn • 14:00</div>
                </div>
                <div class="plane-icon">➔ 🚆 ➔</div>
                <div style="text-align:right;">
                  <div class="stn-code">RUPC</div>
                  <div class="stn-city">Rudrapur • 10:08</div>
                </div>
              </div>
            </div>

            <div class="card-middle">
              <div style="margin-bottom:14px;">
                <div style="font-size:0.75rem; color:#64748b; text-transform:uppercase;">Passenger Name</div>
                <div style="font-size:1.25rem; font-weight:800; color:#0f172a;">${p.name}</div>
              </div>

              <!-- Leg 1 Mini -->
              <div class="leg-badge-box">
                <div class="leg-badge-header">
                  <span>LEG 1: MAHABODHI EXP (12397)</span>
                  <span>22-OCT</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-weight:700;">
                  <span>COACH ${p.leg1.coach} • SEAT ${p.leg1.seat}</span>
                  <span style="color:#0284c7;">${p.leg1.berth}</span>
                </div>
              </div>

              <!-- Leg 2 Mini -->
              <div class="leg-badge-box" style="background:#f0fdf4; border-color:#86efac;">
                <div class="leg-badge-header" style="color:#16a34a;">
                  <span>LEG 2: KATHGODAM SHATABDI (12040)</span>
                  <span>23-OCT</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-weight:700;">
                  <span>COACH ${p.leg2.coach} • SEAT ${p.leg2.seat}</span>
                  <span style="color:#16a34a;">${p.leg2.berth}</span>
                </div>
              </div>

              <div class="info-grid">
                <div>
                  <div class="info-label">Leg 1 PNR</div>
                  <div class="info-val">${p.leg1.pnr}</div>
                </div>
                <div>
                  <div class="info-label">Leg 2 PNR</div>
                  <div class="info-val">${p.leg2.pnr}</div>
                </div>
                <div>
                  <div class="info-label">Status</div>
                  <div class="info-val" style="color:#16a34a;">CONFIRMED</div>
                </div>
              </div>
            </div>

            <div class="card-bottom">
              <div class="barcode-sim"></div>
              <button class="btn-wa-pass" onclick="sharePass('${p.id}')">
                📲 Send Boarding Pass via WhatsApp
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setChip(c, btn) {
      currentChip = c;
      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      filterWallet();
    }

    function filterWallet() {
      const q = document.getElementById('qInput').value.trim().toLowerCase();
      const filtered = passengers.filter(p => {
        const matchesQ = !q || p.name.toLowerCase().includes(q) || (p.leg1.coach + p.leg1.seat).toLowerCase().includes(q) || (p.leg2.coach + p.leg2.seat).toLowerCase().includes(q);
        if (!matchesQ) return false;
        if (currentChip === 'all') return true;
        if (currentChip === 'c2') return p.leg2.coach.toLowerCase() === 'c2';
        if (currentChip === 'c3') return p.leg2.coach.toLowerCase() === 'c3';
        if (currentChip === 'm2') return p.leg1.coach.toLowerCase() === 'm2';
        if (currentChip === 'b1') return p.leg1.coach.toLowerCase() === 'b1';
        return true;
      });
      renderWallet(filtered);
    }

    function sharePass(id) {
      const p = passengers.find(x => x.id === id);
      if (!p) return;
      const text = `🎫 *Baraat Boarding Pass • ${p.name}*%0A` +
        `• Leg 1 (Mahabodhi): Coach *${p.leg1.coach}* / Seat *${p.leg1.seat}* (${p.leg1.berth})%0A` +
        `• Leg 2 (Shatabdi): Coach *${p.leg2.coach}* / Seat *${p.leg2.seat}* (${p.leg2.berth})%0A` +
        `• Gaya Departure: 22-Oct 14:00 ➔ Rudrapur: 23-Oct 10:08%0A` +
        `Helpline: +91 9852218098`;
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    renderWallet();
  </script>
